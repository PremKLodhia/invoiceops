spring:
  application:
    name: invoiceops
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:invoiceops}
    username: ${POSTGRES_USER:invoiceops}
    password: ${POSTGRES_PASSWORD:invoiceops_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE_MB:10}MB
      max-request-size: ${APP_MAX_UPLOAD_SIZE_MB:10}MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  demo-mode: ${APP_DEMO_MODE:false}
  max-upload-size-mb: ${APP_MAX_UPLOAD_SIZE_MB:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui
